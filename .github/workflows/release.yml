# Builds BitsjUI and uploads it to CurseForge, Wago and GitHub Releases.
#
# How to release: raise "## Version:" in BitsjUI.toc and push to main.
# This workflow sees the new version, creates the tag (v3.4.0 ...) itself
# and runs the BigWigs packager. A version that already has a tag is skipped.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "BitsjUI.toc"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from the toc
        id: version
        run: |
          v=$(grep -m1 '^## Version:' BitsjUI.toc | sed 's/## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$v is already released, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the new version
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "BitsjUI ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Package and upload
        if: steps.version.outputs.exists == 'false'
        uses: BigWigsMods/packager@v2
